<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sloppy Strudel</title>
  <style>
    :root { color-scheme: dark; --bg: #14121c; --fg: #f3eefc; --accent: #ffcc33; --panel: #221e30; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
    h1 { margin: 0 0 12px; font-size: 1.4rem; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    button, select { font: inherit; padding: 12px 18px; border-radius: 10px; border: 0; background: var(--panel); color: var(--fg); min-height: 48px; }
    button.play { background: var(--accent); color: #14121c; font-weight: 700; }
    textarea { width: 100%; box-sizing: border-box; height: 70vh; background: var(--panel); color: var(--fg);
               border: 0; border-radius: 10px; padding: 12px; font: 13px/1.45 ui-monospace, monospace; }
    #status { opacity: .8; align-self: center; }
  </style>
</head>
<body>
  <h1>Sloppy Strudel</h1>
  <div class="bar">
    <select id="song">
      <option value="tetris.strudel">Tetris — Theme A (Korobeiniki)</option>
      <option value="soupe-aux-choux.strudel">La Soupe aux choux — hommage</option>
    </select>
    <button class="play" id="play">▶ Play</button>
    <button id="stop">■ Stop</button>
    <span id="status">loading…</span>
  </div>
  <textarea id="code" spellcheck="false"></textarea>

  <script src="https://unpkg.com/@strudel/web@1.3.0"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const ready = initStrudel({
      prebake: () => samples('github:tidalcycles/dirt-samples'),
    });
    async function load() {
      const res = await fetch($('song').value);
      $('code').value = await res.text();
    }
    $('song').addEventListener('change', async () => { hush(); await load(); });
    $('play').addEventListener('click', async () => {
      await ready;
      try { await evaluate($('code').value); $('status').textContent = 'playing'; }
      catch (e) { $('status').textContent = 'error: ' + e.message; console.error(e); }
    });
    $('stop').addEventListener('click', () => { hush(); $('status').textContent = 'stopped'; });
    load().then(() => ready).then(() => { $('status').textContent = 'ready — edit the code live and press Play'; });
  </script>
</body>
</html>
